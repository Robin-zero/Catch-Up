name: Release

# 触发方式：
#   - 推送 v* 标签（例如 v1.0.0）：构建 4 个平台并创建 GitHub Release
#   - 手动运行（workflow_dispatch）：只构建并上传产物，不创建 Release
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   Android（必需，缺少会直接失败）：
#     ANDROID_KEYSTORE_BASE64    release.keystore 的 Base64
#                                PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.catchup-keystore\release.keystore"))
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   iOS（未配置 APPLE_CERTIFICATE + APPLE_MOBILE_PROVISION 时跳过 iOS 任务）：
#     APPLE_CERTIFICATE          .p12 证书 Base64
#     APPLE_CERTIFICATE_PASSWORD
#     APPLE_SIGNING_IDENTITY     例如 "Apple Distribution: XXX (TEAMID)"
#     APPLE_TEAM_ID
#     APPLE_MOBILE_PROVISION     .mobileprovision 的 Base64
#   macOS 签名 / 公证（可选；不配置则输出未签名、未公证的 dmg）：
#     APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_TEAM_ID
#     APPLE_ID / APPLE_PASSWORD / APPLE_PROVIDER_SHORT_NAME

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  prepare:
    name: 检查签名配置
    runs-on: ubuntu-latest
    outputs:
      ios_enabled: ${{ steps.detect.outputs.ios }}
    steps:
      - name: 检测 iOS 签名
        id: detect
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_MOBILE_PROVISION" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "iOS 签名配置齐全，将构建 .ipa。"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS 构建已跳过::缺少 APPLE_CERTIFICATE / APPLE_MOBILE_PROVISION，配置后重新运行即可产出 .ipa。"
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 与 NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=缺少 Android SDK::未在 $SDK 找到 cmdline-tools，请检查 runner 环境。"
            exit 1
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=缺少 Android 签名::请配置 ANDROID_KEYSTORE_BASE64 等 Secrets。"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 APK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npx tauri android build --apk --ci

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: catchup-android
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 构建通用架构 DMG
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ACCOUNT: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          if [ -n "$APPLE_CERT_B64" ]; then
            printf '%s' "$APPLE_CERT_B64" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
            if [ ! -s "$RUNNER_TEMP/cert.p12" ] || [ "$(head -c1 "$RUNNER_TEMP/cert.p12" | od -An -tx1 | tr -d ' \n')" != "30" ]; then
              echo "::error title=APPLE_CERTIFICATE 无效::需要 .p12 证书文件（证书 + 私钥）的 Base64；PEM/cer 或文本路径都不行。也可删除该 Secret，改为输出未签名 dmg。"
              exit 1
            fi
            export APPLE_CERTIFICATE="$APPLE_CERT_B64"
            export APPLE_CERTIFICATE_PASSWORD="$APPLE_CERT_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$APPLE_IDENTITY"
            export APPLE_TEAM_ID="$APPLE_TEAM"
            export APPLE_ID="$APPLE_ACCOUNT"
            export APPLE_PASSWORD="$APPLE_APP_PASSWORD"
            export APPLE_PROVIDER_SHORT_NAME="$APPLE_PROVIDER"
            echo "已检测到 Apple 证书，将签名并公证"
          else
            echo "未配置 APPLE_CERTIFICATE，输出未签名、未公证的 dmg"
          fi
          npx tauri build --target universal-apple-darwin

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: catchup-macos
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows MSI / NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        run: npx tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: catchup-windows
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: iOS IPA
    needs: prepare
    if: needs.prepare.outputs.ios_enabled == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 生成 iOS 工程
        run: npx tauri ios init --ci

      - name: 构建 IPA
        env:
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
        run: npx tauri ios build --ci

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/apple -name "*.ipa" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: catchup-ios
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: [android, macos, windows, ios]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
