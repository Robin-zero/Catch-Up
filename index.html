<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6ef" />
    <script>
      (function () {
        var resolved = null;
        try {
          var saved = localStorage.getItem("catchup.theme");
          if (saved === "light" || saved === "dark") {
            resolved = saved;
          } else {
            var raw = localStorage.getItem("catchup.settings.v1");
            var mode = raw ? JSON.parse(raw).theme : null;
            if (mode === "light" || mode === "dark") {
              resolved = mode;
            }
          }
        } catch (error) {}
        if (!resolved) {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            resolved === "dark" ? "#15171c" : "#f4f6ef",
          );
        }
      })();
    </script>
    <style>
      html {
        background-color: #f2f2ee;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background-color: #15171c;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <meta
      name="description"
      content="追更 CatchUp，集中记录剧集、番剧、综艺、电影与短剧的观看进度。"
    />
    <title>追更 · CatchUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
